name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @godeye/db generate
      - name: Typecheck
        run: pnpm typecheck
      - name: API unit tests
        run: pnpm --filter @godeye/api test
        env:
          TOKEN_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_ACCESS_SECRET: ci-access
          JWT_REFRESH_SECRET: ci-refresh

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: python -m pytest -q

  # Railway watches the repository and redeploys the API, engine, worker and
  # beat on every push. Nothing watched apps/web, so the frontend only moved
  # when someone remembered to run `pnpm cf:deploy` by hand. It drifted weeks
  # behind: the site served a two-word loading screen while the repository held
  # a written homepage, and a connect form asked for keys the server no longer
  # wanted. Backend and frontend now ship on the same push.
  deploy-web:
    runs-on: ubuntu-latest
    needs: [node, engine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Without the token wrangler prompts for a browser login and then hangs
      # until the job times out, so say plainly why nothing shipped instead.
      - name: Check Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set, so apps/web was not deployed."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets > Actions."
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter @godeye/db generate
      - name: Build and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Both are read at build time and baked into the bundle, so they belong
        # here rather than in the Worker's runtime variables. The fallbacks are
        # the hosts already in the deployed bundle: unset, the code falls back
        # to localhost:4000, which would build a site that cannot reach its own
        # API. A repository variable overrides either one if a host changes.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.godeyeautomation.com' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://godeyeautomation.com' }}
        run: pnpm --filter web cf:deploy
