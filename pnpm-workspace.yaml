packages:
  - "apps/web"
  - "apps/api"
  - "packages/*"

# Network resilience — this project is often installed over slow/flaky links
fetchTimeout: 900000
fetchRetries: 10
fetchRetryMaxtimeout: 60000
networkConcurrency: 1
allowBuilds:
  '@prisma/client': true
  # Cloudflare's runtime — its install script fetches the workerd binary, without
  # which the OpenNext build can't run.
  workerd: true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  # Transitive (OpenTelemetry). Its install script is not needed to consume the
  # package, and leaving this unanswered made pnpm exit non-zero on every
  # `pnpm install` — which is what silently broke `pnpm build`, and with it
  # every OpenNext deploy, since OpenNext shells out to `pnpm build`.
  protobufjs: false
