[project]
name = "godeye-engine"
version = "0.1.0"
description = "GODEYE automation engine — AI agents, publishers, scheduler"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "SQLAlchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "httpx>=0.28",
    "cryptography>=43.0",
    "tenacity>=9.0",
    "croniter>=5.0",
    "boto3>=1.35",
    "Pillow>=11.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
openai = ["openai>=1.55"]
google = ["google-genai>=0.3"]
dev = ["pytest>=8.3", "pytest-mock>=3.14", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
