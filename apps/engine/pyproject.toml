[project]
name = "godeye-engine"
version = "0.1.0"
description = "GODEYE automation engine — AI agents, publishers, scheduler"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "SQLAlchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "httpx>=0.28",
    "cryptography>=43.0",
    "tenacity>=9.0",
    "croniter>=5.0",
    "boto3>=1.35",
    "Pillow>=11.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
openai = ["openai>=1.55"]
google = ["google-genai>=0.3"]
dev = ["pytest>=8.3", "pytest-mock>=3.14", "pytest-cov>=6.0", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Declared, not inherited.
#
# The config used to set only line-length and target-version, so the rule set
# was whatever ruff's default happened to be that month -- and it moved. Running
# the current release against this code reports 131 findings from rules nobody
# opted into, which means the engine CI job would fail on a lint change nobody
# in this repository made. A linter that changes what it checks under you turns
# an unrelated release into a red build, and a red build nobody caused is a
# build somebody switches off.
#
# So the set is written down. E4/E7/E9 and F are the correctness core; B is
# flake8-bugbear, which is the one that earned its place here -- it found a
# loop-variable closure, an unchained raise, and a zip() that silently truncated
# captions off the end of a video. I is import sorting, deterministic and
# fixable.
#
# E501 (line length) is deliberately NOT selected. 37 existing lines exceed 100
# characters, they are prose comments rather than code, and reflowing them in
# the same branch as a security fix makes both unreviewable.
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
