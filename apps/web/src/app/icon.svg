<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- No background tile: the crest is drawn as line art, matching the app.
       An SVG favicon honours prefers-color-scheme, so the stroke flips to white
       on dark browser chrome instead of disappearing into it. -->
  <style>
    .crest { stroke: #1a1b26; }
    @media (prefers-color-scheme: dark) { .crest { stroke: #ffffff; } }
    .pupil { fill: #1a1b26; }
    @media (prefers-color-scheme: dark) { .pupil { fill: #ffffff; } }
  </style>
  <g class="crest" fill="none" stroke-linejoin="round" stroke-linecap="round"
     transform="translate(100 100) scale(0.92) translate(-100 -100)">
    <g stroke-width="6">
      <path d="M100 4 L100 20 M167.9 43.5 L157.6 53.8 M196 100 L180 100 M167.9 156.5 L157.6 146.2"/>
      <path d="M100 196 L100 180 M32.1 156.5 L42.4 146.2 M4 100 L20 100 M32.1 43.5 L42.4 53.8"/>
    </g>
    <circle cx="100" cy="100" r="76" stroke-width="4.5"/>
    <path d="M100 30 L166 148 L34 148 Z" stroke-width="8"/>
    <path d="M100 48 L150 140 L50 140 Z" stroke-width="4"/>
    <path d="M100 30 L100 48" stroke-width="3.5"/>
    <g transform="translate(100 108) scale(1.35) translate(-50 -57)">
      <path d="M27 57 Q50 39 73 57 Q50 75 27 57 Z" stroke-width="6"/>
      <circle class="pupil" cx="50" cy="57" r="6.5" stroke="none"/>
    </g>
  </g>
</svg>
