# Backing services for integration tests.
#
# Separate from docker-compose.yml on purpose. That file is the dev stack and its
# volumes persist; a test run that truncates tables must never be pointed at the
# database somebody is developing against. Everything here is ephemeral (tmpfs) and
# on offset ports, so both stacks can run at once.
#
#   docker compose -f infra/docker/docker-compose.test.yml up -d --wait
#   pnpm --filter @godeye/api test:integration
#   docker compose -f infra/docker/docker-compose.test.yml down -v
#
# --wait blocks until every healthcheck passes, so tests never race the containers.

name: godeye-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: godeye_test
      POSTGRES_PASSWORD: godeye_test
      POSTGRES_DB: godeye_test
      # Test data is disposable; durability costs more than it is worth here.
      PGDATA: /var/lib/postgresql/data
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c max_connections=200
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godeye_test -d godeye_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis-test:
    image: redis:7-alpine
    # No appendonly: a test broker that survives a restart is a test that leaks
    # state between runs.
    command: redis-server --save "" --appendonly no
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: godeye_test
      MINIO_ROOT_PASSWORD: godeye_test_secret
    ports:
      - "59000:9000"
      - "59001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  createbuckets-test:
    image: minio/mc:latest
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-test:9000 godeye_test godeye_test_secret &&
      mc mb --ignore-existing local/godeye-media-test &&
      mc anonymous set download local/godeye-media-test
      "
